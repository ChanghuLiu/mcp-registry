name: mcpub submit and verify

on:
  push:
    branches:
      - automation/mcpub-submit-2026-09-12

jobs:
  submit-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Submit and verify four MCP endpoints
        shell: bash
        run: |
          set -euo pipefail
          submit() {
            local url="$1"
            local description="$2"
            echo "=== SUBMIT $url ==="
            curl --fail-with-body -sS -X POST https://mcpub.dev/mcp \
              -H 'Content-Type: application/json' \
              --data-binary "$(jq -nc --arg url "$url" --arg description "$description" '{jsonrpc:"2.0",id:1,method:"tools/call",params:{name:"submit",arguments:{url:$url,description:$description}}}')"
            echo
            echo "=== GET $url ==="
            curl --fail-with-body -sS -X POST https://mcpub.dev/mcp \
              -H 'Content-Type: application/json' \
              --data-binary "$(jq -nc --arg url "$url" '{jsonrpc:"2.0",id:2,method:"tools/call",params:{name:"get",arguments:{url:$url}}}')"
            echo
          }

          submit 'https://england-works-watch-production.up.railway.app' 'Evidence-linked UK Skilled Worker sponsor-compliance monitoring and deterministic preflight.'
          submit 'https://cqc-provider-mcp-production.up.railway.app' 'Evidence-linked CQC provider registration and regulatory preflight decisions for England.'
          submit 'https://uk-taxi-phv-mcp-production.up.railway.app' 'Evidence-linked taxi and private-hire licensing preflight and local-authority comparison for England.'
          submit 'https://uk-premises-licence-mcp-production.up.railway.app' 'Evidence-first premises-licensing preflight under the Licensing Act 2003.'
